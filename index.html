<script>
/* 🔄 التنقل بين الصفحات */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');

  // تحديث وحقن الإعلان البيني فقط إذا ضغط المستخدم على صفحة earn
  if(id === 'earn') {
    refreshInterstitialAd();
  }
}

/* 📢 دالة تحديث وحقن الإعلان البيني داخل صفحة Earn */
function refreshInterstitialAd() {
  const adBox = document.getElementById("interstitial-ad-box");
  
  // تنظيف الحاوية أولاً لحذف الإعلان القديم
  adBox.innerHTML = "";
  
  // إنشاء عنصر سكريبت جديد للإعلان البيني الخاص بـ Advertica
  const adScript = document.createElement("script");
  adScript.type = "text/javascript";
  adScript.src = "//data527.click/31466c31ab275920bbde/043588bf7d/?placementName=default";
  
  // حقن السكريبت داخل صفحة earn لتشغيل وتحديث الإعلان فوراً
  adBox.appendChild(adScript);
}

/* 🎮 اللعبة */
const container = document.getElementById("tubes-container");
const COLORS = ["red","blue","green","yellow","orange","brown","pink","turquoise","white","gray"];

let tubes = [];
let selected = null;
let score = 0;

/* إنشاء لعبة */
function generate(){
  tubes = [];
  container.innerHTML = "";

  let pool = [];

  COLORS.forEach(c=>{
    for(let i=0;i<4;i++) pool.push(c);
  });

  pool.sort(()=>Math.random()-0.5);

  for(let i=0;i<13;i++) tubes.push([]);

  pool.forEach(color=>{
    let placed = false;
    while(!placed){
      let t = Math.floor(Math.random()*10);
      if(tubes[t].length < 4){
        tubes[t].push(color);
        placed = true;
      }
    }
  });

  draw();
}

/* رسم */
function draw(){
  container.innerHTML = "";

  tubes.forEach((tube,i)=>{
    let div = document.createElement("div");
    div.className = "tube";

    tube.forEach(c=>{
      let b = document.createElement("div");
      b.className = "block "+c;
      div.appendChild(b);
    });

    div.onclick = ()=>clickTube(i);
    container.appendChild(div);
  });
}

/* اختيار ونقل */
function clickTube(i){

  if(selected===null){
    selected=i;
    return;
  }

  if(selected===i){
    selected=null;
    return;
  }

  let a = tubes[selected];
  let b = tubes[i];

  if(a.length>0){
    let color = a[a.length-1];

    if(b.length===0 || b[b.length-1]===color){
      a.pop();
      b.push(color);
    }
  }

  selected=null;
  draw();
  checkWin();
}

/* التحقق من الفوز */
function checkWin(){
  let win = tubes.every(t=>{
    return t.length===0 || t.every(c=>c===t[0]);
  });

  if(win){
    score++;
    document.getElementById("score").innerText="النقاط: "+score;
    alert("🎉 فزت!");
    generate();
  }
}

generate();
</script>
